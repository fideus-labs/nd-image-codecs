name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege for every job: this workflow only builds, lints, and tests
# a checkout — nothing here writes to the repository or its metadata. Any job
# that needs more has to opt in explicitly with its own block.
permissions:
  contents: read

jobs:
  # A mistyped `runs-on` label is not an error to GitHub — the job just queues
  # forever against a runner that will never exist. actionlint validates labels
  # against the known-image list, which is the only cheap guard on the matrix
  # below.
  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # This job executes a downloaded binary; keep the job token out of
          # .git/config so that binary can never read it.
          persist-credentials: false
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Upstream publishes no build attestation, so the release's own
          # published SHA256 is the integrity check. Update both together.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color

      # actionlint checks that a workflow is *valid*; zizmor checks that it is
      # not exploitable. Scoped to release.yml on purpose: that is the only
      # workflow here that can publish to a registry or write to the
      # repository, and so the only one whose security properties are worth a
      # gate. Pointing zizmor at the whole directory would demand hash-pinning
      # every action in every workflow — a reasonable thing to want, but a
      # separate decision from shipping the release pipeline.
      #
      # Offline mode (the default) keeps this deterministic and tokenless. Two
      # findings are waived inline in release.yml, each with its reason.
      - name: Audit the release workflow
        run: |
          pipx install zizmor==1.29.0
          zizmor --persona=regular .github/workflows/release.yml

  # The one published version number lives in seven hand-edited files. A
  # partial bump is silent — cargo will happily publish crates carrying a
  # stale internal dependency pin, and those are unresolvable on crates.io
  # forever. This job holds that number, and the release scripts that write it,
  # to account. Buildless, so it fails in seconds.
  package-versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/ci/check-package-versions.py

      # The release workflow stamps the tag's version into those same files
      # before it builds anything, so the writer has to keep working as the
      # files move — and the failure mode is a release that publishes a stale
      # version number to four registries. Write a sentinel everywhere, let the
      # reader confirm it landed, restore only what changed, and confirm that
      # too. Buildless, so it costs a second. (The restore is safe because this
      # is a pristine checkout; do not run it in a working tree you care about.)
      - name: Self-test the release version stamp
        run: |
          python3 scripts/release/set-version.py 9.9.9
          git diff --name-only | xargs -r git checkout --
          python3 scripts/ci/check-package-versions.py

      # The rest of the release scripts, against a synthetic repository in a
      # temporary directory: the tag grammar, the third-party pins in both
      # lockfiles that must not move, the npm formatting that must survive, and
      # the exclude list that lets a re-run finish a half-published release.
      # None of that is reachable from the round trip above, and all of it is
      # unrecoverable if it ships wrong.
      #
      # Plus the shape of release.yml itself — the `needs:` graph that decides
      # how many times a release stops for a human and what has been proven
      # before any of it becomes irreversible. PyYAML is for that suite; it
      # reads the real workflow, because the file under test *is* the artifact.
      - name: Test the release scripts
        run: |
          pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3
          pytest scripts/tests -q

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      # Feature-gated surfaces: the zarrs codec registration and the
      # serde-gated config types. The bench workloads are no longer a feature —
      # they live in ndic-bench-cli and are covered by --all-targets.
      - run: cargo clippy --workspace --all-targets --features ndic-zarr/zarrs,ndic-lift/serde

  test:
    name: test (${{ matrix.os }})
    strategy:
      # Architecture-specific failures are the whole point of this matrix, so
      # let every leg report rather than cancelling siblings on the first red.
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04       # linux   x86_64
          - ubuntu-24.04-arm   # linux   aarch64
          - macos-26-intel     # macOS   x86_64 Intel image
          - macos-26           # macOS   aarch64 (Apple silicon)
          - windows-2022       # windows x86_64
          - windows-11-arm     # windows aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The feature set is a strict superset of the default build: it adds the
      # zarrs codec registration (nd_lift composed with stock blosc) and the
      # serde-gated conformance-vector tests.
      - run: cargo test --workspace --features ndic-zarr/zarrs,ndic-lift/serde

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # `@stable` is deliberate here and in every other job: `rust-toolchain.toml`
      # pins the compiler (1.98.0), and rustup honours that pin over whatever the
      # action made default, auto-installing it on the first cargo invocation —
      # along with both `targets` the toml lists. The `targets:` input below is a
      # narrower thing: it pre-installs, under the action's own toolchain, only
      # what this job compiles for. It is deliberately not the toml's full list.
      # wasm32-wasip2 is pinned there because the Phase 05 audit clippied against
      # it (docs/development/rust-198/unsafe-audit.md); no CI job builds for it,
      # so installing it here would only cost time. Add it if a job ever does.
      # No job pins a Rust version.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ndic-zarr -p ndic-core --target wasm32-unknown-unknown

  # Two documentation builds: rustdoc for the API, mystmd for the prose site.
  # The MyST half runs `npm run check` (docs/package.json) — the same script
  # .readthedocs.yaml runs to deploy the site, so a green `docs` job means the
  # Read the Docs build will succeed too. Keep the Node version here in step
  # with `build.tools.nodejs` in .readthedocs.yaml.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ahead of even the Node install: this is a stdlib-only script over two
      # inputs, so it costs milliseconds, and it covers the one class of docs
      # breakage the strict MyST build does not. A page missing from the toc
      # builds clean and silently never appears on the site; a toc entry naming
      # a deleted file prints a ⛔️ and still exits 0. Both stay green in
      # `npm run check` — measured, not assumed.
      - run: python3 scripts/ci/check-docs-toc.py

      # MyST next: the site builds in well under a minute, so putting it ahead
      # of the Rust toolchain install, the cache restore, and rustdoc means a
      # broken link fails the job in about a tenth of the time.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run check
        working-directory: docs

      # Lets a reviewer read the rendered site straight from the pull request
      # instead of waiting on the Read the Docs preview. `if-no-files-found:
      # error` is deliberate: it turns a change in mystmd's output directory
      # into a loud failure rather than an empty artifact nobody notices.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_build/html
          retention-days: 7
          if-no-files-found: error

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: pipx install maturin
      - run: maturin build --release -m bindings/python/nd-image-codecs/Cargo.toml
      # imagecodecs powers the third-party interop lanes (JPEG 2000, delta,
      # ZFP); ngff-zarr + ome-zarr power the OME-Zarr 0.5 integration lane —
      # without them those tests silently skip.
      - run: pip install pytest "zarr>=3.1" numpy numcodecs imagecodecs "ngff-zarr[validate]" ome-zarr
      # Install the built wheel so the suite exercises the native extension
      # (the htj2k codec has no pure-Python fallback and skips without it).
      - run: pip install --no-index --find-links target/wheels nd-image-codecs
      - run: python -m pytest bindings/python/nd-image-codecs/tests -q
      # The htj2k lane must have actually run, not skipped.
      - run: python -c "from nd_image_codecs import _nd_image_codecs as m; assert hasattr(m, 'htj2k_encode') and hasattr(m, 'nd_zfp_encode')"

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: bindings/typescript
      # Build the WASM core first: the htj2k round-trip tests skip without
      # it, and skipping in CI would hide a broken binding.
      - run: npm run build:wasm
        working-directory: bindings/typescript
      - run: npm run build
        working-directory: bindings/typescript
      - run: npm test
        working-directory: bindings/typescript
      - run: test -f bindings/typescript/src/wasm/ndic_zarr_bg.wasm

  series-equality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/ci/check-series-equality.py

  # Every code block under docs/usage is executed against the current API:
  # Rust compiled and run, Python and TypeScript imported and run, shell
  # executed, codec configurations round-tripped through their codecs. A
  # snippet that cannot run carries an inline reason the check reports.
  # Separate from the `docs` job on purpose: that one is Node-only and fails
  # a broken link in ~1/10 the time this needs.
  usage-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - run: pip install "zarr>=3.1" numpy numcodecs imagecodecs "ngff-zarr[validate]"
      - run: pip install bindings/python/nd-image-codecs
      - run: npm ci
        working-directory: bindings/typescript
      # The TypeScript snippets import the package by name, which resolves to
      # dist/ — so it has to be built, WASM core and all.
      - run: npm run build:wasm
        working-directory: bindings/typescript
      - run: npm run build
        working-directory: bindings/typescript
      - run: python3 scripts/ci/check-usage-docs.py

  # The cross-ecosystem validation matrix: every case in
  # fixtures/cross-validation/cases.json is written by zarrs (ndic zarr),
  # zarr-python (our entry points), and zarrita.js (our WASM classes), and
  # read back by all three — 3×3 direction pairs per case, with chunk-level
  # byte identity for the families backed by the shared Rust core.
  cross-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - run: pip install "zarr>=3.1" numpy numcodecs
      # The wheel brings the native extension (htj2k / nd_zfp encoders).
      - run: pip install bindings/python/nd-image-codecs
      - run: npm ci
        working-directory: bindings/typescript
      - run: npm run build:wasm
        working-directory: bindings/typescript
      - run: python3 scripts/ci/check-cross-validation.py

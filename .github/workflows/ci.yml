name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege for every job: this workflow only builds, lints, and tests
# a checkout — nothing here writes to the repository or its metadata. Any job
# that needs more has to opt in explicitly with its own block.
permissions:
  contents: read

jobs:
  # A mistyped `runs-on` label is not an error to GitHub — the job just queues
  # forever against a runner that will never exist. actionlint validates labels
  # against the known-image list, which is the only cheap guard on the matrix
  # below.
  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # This job executes a downloaded binary; keep the job token out of
          # .git/config so that binary can never read it.
          persist-credentials: false
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Upstream publishes no build attestation, so the release's own
          # published SHA256 is the integrity check. Update both together.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      # Feature-gated surfaces: the zarrs codec registration and the
      # serde-gated config types. The bench workloads are no longer a feature —
      # they live in ndic-bench-cli and are covered by --all-targets.
      - run: cargo clippy --workspace --all-targets --features ndic-zarr/zarrs,ndic-lift/serde

  test:
    name: test (${{ matrix.os }})
    strategy:
      # Architecture-specific failures are the whole point of this matrix, so
      # let every leg report rather than cancelling siblings on the first red.
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04       # linux   x86_64
          - ubuntu-24.04-arm   # linux   aarch64
          - macos-15-intel     # macOS   x86_64 — last Intel image, retires ~fall 2027
          - macos-15           # macOS   aarch64 (Apple silicon)
          - windows-2022       # windows x86_64
          - windows-11-arm     # windows aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The feature set is a strict superset of the default build: it adds the
      # zarrs codec registration (nd_lift composed with stock blosc) and the
      # serde-gated conformance-vector tests.
      - run: cargo test --workspace --features ndic-zarr/zarrs,ndic-lift/serde

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ndic-zarr -p ndic-core --target wasm32-unknown-unknown

  # Two documentation builds: rustdoc for the API, mystmd for the prose site.
  # The MyST half runs `npm run check` (docs/package.json) — the same script
  # .readthedocs.yaml runs to deploy the site, so a green `docs` job means the
  # Read the Docs build will succeed too. Keep the Node version here in step
  # with `build.tools.nodejs` in .readthedocs.yaml.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # MyST first: the site builds in well under a minute, so putting it ahead
      # of the Rust toolchain install, the cache restore, and rustdoc means a
      # broken link fails the job in about a tenth of the time.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run check
        working-directory: docs

      # Lets a reviewer read the rendered site straight from the pull request
      # instead of waiting on the Read the Docs preview. `if-no-files-found:
      # error` is deliberate: it turns a change in mystmd's output directory
      # into a loud failure rather than an empty artifact nobody notices.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_build/html
          retention-days: 7
          if-no-files-found: error

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: pipx install maturin
      - run: maturin build --release -m bindings/python/nd-image-codecs/Cargo.toml
      - run: pip install pytest "zarr>=3.1" numpy numcodecs
      # Install the built wheel so the suite exercises the native extension
      # (the htj2k codec has no pure-Python fallback and skips without it).
      - run: pip install --no-index --find-links target/wheels nd-image-codecs
      - run: python -m pytest bindings/python/nd-image-codecs/tests -q
      # The htj2k lane must have actually run, not skipped.
      - run: python -c "from nd_image_codecs import _nd_image_codecs as m; assert hasattr(m, 'htj2k_encode')"

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: bindings/typescript
      # Build the WASM core first: the htj2k round-trip tests skip without
      # it, and skipping in CI would hide a broken binding.
      - run: npm run build:wasm
        working-directory: bindings/typescript
      - run: npm run build
        working-directory: bindings/typescript
      - run: npm test
        working-directory: bindings/typescript
      - run: test -f bindings/typescript/src/wasm/ndic_zarr_bg.wasm

  series-equality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/ci/check-series-equality.py

  # Interop matrix (decode our output with third-party implementations) is
  # added once the encoder lands — see docs/development/roadmap/phase-3-htj2k-core.md.

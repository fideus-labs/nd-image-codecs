name: Bench PR Gate

on:
  pull_request:
    paths:
      - "crates/**"
      - "bench/**"
      - "bindings/python/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"

env:
  CARGO_TERM_COLOR: always

# The sticky-comment step needs to write PR comments; everything else is
# read-only. (Fork PRs still get a read-only token — the comment step is
# best-effort there.)
permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python bench dependencies
        run: pip install "zarr>=3.1" numpy numcodecs

      - name: Run the nd-delta lanes
        run: python3 bench/py/run_nd_delta.py --samples 10

      - name: Run the nd-lift lanes
        run: python3 bench/py/run_nd_lift.py --samples 10

      # The nd-zfp lanes run the native codec through zarr-python, so they
      # need the built wheel (the pure-Python source tree has no ZFP core).
      - name: Build and install the nd-image-codecs wheel
        run: pip install bindings/python/nd-image-codecs

      - name: Run the nd-zfp lanes
        run: python3 bench/py/run_nd_zfp.py --samples 10

      # Rust-side workloads register via inventory as codec phases land;
      # this writes their records into the same tree.
      - name: Run Rust benchmarks
        run: cargo run -p ndic-bench-cli --release -- run --quiet

      # The committed baseline's σ noise envelope is only valid on the runner
      # class it was captured on, so the gate is derived from the baseline
      # manifest itself: a baseline recorded on this workflow's runner class
      # (`gha-ubuntu-24.04`, via bench-baseline-refresh) gates both time and
      # ratio; any other capture machine gates ratio only, with timing
      # reported. Adopting a CI-runner baseline therefore switches the
      # throughput gate on without editing this file.
      - name: Compare against the main baseline
        shell: bash
        run: |
          machine="$(python3 -c 'import json; print(json.load(open("bench/baselines/main/manifest.json"))["machine"])')"
          if [ "$machine" = "gha-ubuntu-24.04" ]; then gate=both; else gate=ratio; fi
          echo "baseline machine: $machine → --gate $gate"
          cargo run -p ndic-bench-cli --release -- compare bench/baselines/main \
            --gate "$gate" \
            --fail-on-regression \
            --format markdown | tee bench-report.md

      - name: Sticky PR comment with the report
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench-report
          path: bench-report.md

<!-- Source for nd-image-codecs-social.png, the 1200x630 Open Graph card set as
     `project.thumbnail` in myst.yml. Regenerate the PNG by opening this file in
     a browser at a 1200x630 viewport and screenshotting it; every link preview
     surface that matters (Slack, GitHub, X, LinkedIn) ignores an SVG og:image,
     so the PNG is the file that ships and this is only the editable source. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b1120"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- the logo mark, scaled from the 160x160 viewBox to 220x220 -->
  <g transform="translate(86 205) scale(1.375)">
    <g fill="none" stroke="url(#mark)" stroke-width="6" stroke-linejoin="round">
      <path d="M30 112 L80 88 L130 112 L80 136 Z" opacity="0.55"/>
      <path d="M30 88 L80 64 L130 88 L80 112 Z" opacity="0.78"/>
      <path d="M30 64 L80 40 L130 64 L80 88 Z"/>
    </g>
    <path d="M80 30 q6 -10 12 0 t12 0" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g font-family="Ubuntu Sans, DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="336" y="288" font-size="70" font-weight="700" fill="#f8fafc">nd-image-codecs</text>
    <text x="338" y="342" font-size="30" fill="#94a3b8">Composable Zarr v3 codecs for ND scientific images</text>
    <rect x="338" y="378" width="96" height="5" rx="2.5" fill="url(#rule)"/>
    <text x="338" y="440" font-size="27" font-family="Fira Code, DejaVu Sans Mono, monospace" fill="#7dd3fc">nd-delta · nd-lift-ht · nd-zfp</text>
    <text x="88" y="566" font-size="21" fill="#64748b">github.com/fideus-labs/nd-image-codecs</text>
  </g>
</svg>

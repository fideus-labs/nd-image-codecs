# Suite manifest: which workloads run where, with what sampling.
# Consumed by ndic-bench-cli (Phase 1) and CI workflows.

[suite]
default_samples = 30
warmup_samples = 3

# Codec-configuration matrix (labels must match builtin_configs in the CLI).
[[config]]
label = "blosc-zstd"          # plain bytes → blosc(shuffle, zstd): the reference lane
family = "baseline"
simd = false
irreversible = false
lift_levels = 0

[[config]]
label = "nd-delta-zstd"
family = "nd-delta"
simd = false
irreversible = false
lift_levels = 0

[[config]]
label = "nd-delta-lz4"
family = "nd-delta"
simd = false
irreversible = false
lift_levels = 0

# Phase 2 validation lanes: transpose → nd_lift → bytes → blosc(zstd), so the
# nd_lift decorrelation gain is measurable before the htj2k plane codec lands.
[[config]]
label = "nd-lift-delta-zstd"
family = "nd-lift"
simd = false
irreversible = false
lift_levels = 0            # 0 ⇒ the delta kind

[[config]]
label = "nd-lift-53-zstd"
family = "nd-lift"
simd = false
irreversible = false
lift_levels = 2            # two 5/3 levels along z (and t when grouped)

[[config]]
label = "scalar-53-ht"
family = "nd-lift-ht"
simd = false
irreversible = false
lift_levels = 0

[[config]]
label = "simd-53-ht"
family = "nd-lift-ht"
simd = true
irreversible = false
lift_levels = 0

[[config]]
label = "simd-97-ht"
family = "nd-lift-ht"
simd = true
irreversible = true
lift_levels = 0

[[config]]
label = "simd-53-lift-z2"
family = "nd-lift-ht"
simd = true
irreversible = false
lift_levels = 2

[[config]]
label = "zfp-rate8"
family = "nd-zfp"
simd = true
irreversible = true
lift_levels = 0

# Reference lanes: pinned external implementations, identical fixtures.
[[ref_lane]]
label = "ref-openjph"
kind = "cli"
encode = "ojph_compress"
expand = "ojph_expand"
version = "0.24.0"          # pin; update deliberately
enabled = false              # enabled in Phase 5

[[ref_lane]]
label = "ref-imagecodecs"
kind = "python"
module = "imagecodecs"
version = "2025.1.1"
enabled = false

[[ref_lane]]
label = "ref-zfp"
kind = "ffi"
crate = "zfp-sys"
version = "1.0"             # tracks the reference C library
enabled = false              # enabled in Phase 5

# CI contexts: which (workload-tier × config) combinations run when.
[contexts.pr-gate]
tiers = ["micro", "meso"]
configs = ["blosc-zstd", "nd-delta-zstd", "nd-delta-lz4", "nd-lift-delta-zstd", "nd-lift-53-zstd", "simd-53-ht", "simd-53-lift-z2"]
fail_on_regression = true
baseline = "main"
# Cross-machine timing is not comparable to the committed baseline's σ
# envelope, so the PR gate fails only on the deterministic ratio gate.
gate = "ratio"

[contexts.nightly]
tiers = ["micro", "meso", "macro"]
configs = ["blosc-zstd", "nd-delta-zstd", "nd-delta-lz4", "nd-lift-delta-zstd", "nd-lift-53-zstd", "scalar-53-ht", "simd-53-ht", "simd-97-ht", "simd-53-lift-z2", "zfp-rate8"]
ref_lanes = true

[contexts.on-demand]
tiers = ["micro", "meso", "macro"]
configs = "all"
ref_lanes = true

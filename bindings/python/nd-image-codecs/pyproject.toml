[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nd-image-codecs"
version = "0.3.0"
description = "Composable Zarr v3 codecs (nd-delta, nd-lift-ht, nd-zfp) for ND scientific images — cross-axis lifting, HTJ2K coefficient planes, and ZFP, with an axis-aware codec-series builder."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fideus Labs LLC" }]
keywords = ["htj2k", "jpeg2000", "zfp", "zarr", "numcodecs", "microscopy", "compression", "ome-ngff"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Deliberately just NumPy. Nothing here imports `numcodecs`: the nd-delta
# family only *names* `numcodecs.delta` in its Zarr v3 metadata, and it is
# `zarr-python` that resolves that name through numcodecs' own entry points.
# Depending on it directly would have cost the wheels their musllinux and
# Windows/arm64 platforms, which numcodecs does not publish.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# `zarr` pulls `numcodecs>=0.14` itself, which is what makes the nd-delta
# pipeline runnable; it is not restated here.
zarr = ["zarr>=3.1"]
test = ["pytest", "imagecodecs", "jsonschema>=4.0.0", "zarr>=3.1", "ngff-zarr[validate]", "ome-zarr>=0.12.0"]

# Zarr v3 codec entry points: let `zarr-python` discover each codec by name
# without an explicit import. See
# https://zarr.readthedocs.io/en/stable/user-guide/extending.html
[project.entry-points."zarr.codecs"]
"nd_lift" = "nd_image_codecs.zarr_codec:NdLiftCodec"
"htj2k" = "nd_image_codecs.zarr_codec:Htj2kCodec"
"zfp" = "nd_image_codecs.zarr_codec:NdZfpCodec"
"reshape" = "nd_image_codecs.zarr_codec:ReshapeCodec"
# The pre-adoption name, kept readable for existing stores.
"nd_zfp" = "nd_image_codecs.zarr_codec:NdZfpCodec"

[project.urls]
Repository = "https://github.com/fideus-labs/nd-image-codecs"
Documentation = "https://github.com/fideus-labs/nd-image-codecs/tree/main/docs"

[tool.maturin]
module-name = "nd_image_codecs._nd_image_codecs"
python-source = "python"
features = ["pyo3/abi3-py311", "pyo3/extension-module"]
# maturin copies `python-source` verbatim, so a wheel built from a tree that has
# ever run the test suite carries that tree's `__pycache__` — including bytecode
# for interpreter versions this wheel was not built against. CI never sees it
# (every release job builds from a fresh checkout), but the hand-publish path in
# docs/development/publishing.md builds from a working tree, where it is the
# normal state.
exclude = ["**/__pycache__/**"]

[package]
name = "ndic-zarr"
description = "Zarr v3 codecs (nd_lift, htj2k, nd_zfp) and the axis-aware codec-series builder for nd-image-codecs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# cdylib for the wasm-pack build (`bindings/typescript`, feature `wasm`);
# rlib so every native consumer links the crate as usual.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Registers the codecs into the zarrs plugin registry (native use).
zarrs = ["dep:zarrs", "dep:inventory", "dep:bytemuck", "ndic-lift/serde", "ndic-zfp/serde"]
# WASM build for the TypeScript / numcodecs.js binding.
wasm = ["dep:wasm-bindgen", "dep:js-sys", "ndic-zfp/serde"]

[dependencies]
ndic-core.workspace = true
ndic-htj2k.workspace = true
ndic-codestream.workspace = true
ndic-lift.workspace = true
ndic-zfp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zarrs = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[dev-dependencies]
# The round-trip tests compose nd_lift with stock zarrs codecs
# (`transpose → nd_lift → bytes → blosc`); dev-only so the default and wasm
# builds stay lean. The test files are additionally gated on the crate's
# `zarrs` feature.
zarrs = { workspace = true, features = ["blosc", "transpose"] }
bytemuck.workspace = true

[lints]
workspace = true

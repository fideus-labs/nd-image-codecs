[package]
name = "ndic-lift"
description = "Explicit ND lifting/delta decorrelation transforms — the `nd_lift` Zarr v3 array-to-array codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = ["ndic-core/std"]
# Serde derives for the codec configuration types (implies std).
serde = ["dep:serde", "std"]

[dependencies]
ndic-core.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

# Regenerates fixtures/nd-lift/vectors.json (deliberate semantics changes only).
[[example]]
name = "gen_vectors"
required-features = ["serde"]

[lints]
workspace = true

[package]
name = "ndic-cli"
description = "The ndic command-line tool: compress, expand, inspect, index, and generate Zarr v3 codec series for nd-image-codecs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "ndic"
path = "src/main.rs"

[features]
default = []
# `ndic zarr write|read`: Zarr v3 filesystem-store I/O through the registered
# codecs — the zarrs corner of the cross-ecosystem validation matrix.
zarr = ["dep:zarrs", "dep:serde", "ndic-zarr/zarrs"]

[dependencies]
ndic-core.workspace = true
ndic-codestream.workspace = true
ndic-lift = { workspace = true, features = ["serde"] }
ndic-zarr.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
clap.workspace = true
png.workspace = true
ureq.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zarrs = { workspace = true, optional = true, features = ["filesystem", "blosc", "transpose"] }

[lints]
workspace = true

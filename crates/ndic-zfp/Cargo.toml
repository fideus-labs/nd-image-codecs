[package]
name = "ndic-zfp"
description = "ZFP block compression (1D–4D) over the pure-Rust zfp-rs core — the `nd_zfp` Zarr v3 array-to-bytes codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = ["std"]
std = ["ndic-core/std"]
# Serde derives for the codec configuration type (implies std).
serde = ["dep:serde", "std"]

[dependencies]
ndic-core.workspace = true
zfp-rs.workspace = true
bytemuck.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

# Regenerates fixtures/zfp/ (deliberate format changes only).
[[example]]
name = "gen_fixtures"
required-features = ["serde"]

[lints]
workspace = true
